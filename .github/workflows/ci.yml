name: CI and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Check minimal feature build
        run: cargo check --locked --workspace --all-targets --no-default-features

      - name: Run tests
        run: cargo test --locked --all --tests -- --nocapture

  msrv:
    name: Minimum Supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Audit lockfile
        run: cargo audit --deny warnings

      - name: Check dependency policy
        run: cargo deny check

  build:
    name: Build (${{ matrix.target }})
    needs: [lint-and-test, msrv, dependency-audit]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux builds (using musl for static linking via cross)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: datadog-mcp
            asset_name: datadog-mcp-linux-amd64
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact_name: datadog-mcp
            asset_name: datadog-mcp-linux-arm64
            use_cross: true
          # Windows builds
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: datadog-mcp.exe
            asset_name: datadog-mcp-windows-amd64
            use_cross: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: datadog-mcp.exe
            asset_name: datadog-mcp-windows-arm64
            use_cross: false
          # macOS builds
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: datadog-mcp
            asset_name: datadog-mcp-macos-amd64
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: datadog-mcp
            asset_name: datadog-mcp-macos-arm64
            use_cross: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.use_cross == true
        run: cargo install cross --version 0.2.5 --locked

      - name: Set PERL for OpenSSL (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = (& where.exe perl)[0]
          "PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Disable keyring for cross-compiled builds (requires system DBus)
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --locked --release --target "${{ matrix.target }}" -p datadog-mcp --no-default-features --features toon
          else
            cargo build --locked --release --target "${{ matrix.target }}" -p datadog-mcp
          fi

      - name: Build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --release --target '${{ matrix.target }}' -p datadog-mcp

      - name: Package binary
        shell: bash
        run: |
          echo "Packaging for OS: ${{ runner.os }}"
          cd "target/${{ matrix.target }}/release"
          if [ "${{ runner.os }}" == "Windows" ]; then
            7z a "../../../${{ matrix.asset_name }}.zip" "${{ matrix.artifact_name }}"
            echo "ASSET_PATH=${{ matrix.asset_name }}.zip" >> "$GITHUB_ENV"
            echo "Created ../../../${{ matrix.asset_name }}.zip"
          else
            tar -czf "../../../${{ matrix.asset_name }}.tar.gz" "${{ matrix.artifact_name }}"
            echo "ASSET_PATH=${{ matrix.asset_name }}.tar.gz" >> "$GITHUB_ENV"
            echo "Created ../../../${{ matrix.asset_name }}.tar.gz"
          fi
          ls ../../../
          cd ../../../

      - name: Upload Release Asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  create_release:
    name: Create Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Verify tag matches workspace version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "datadog-mcp") | .version')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match workspace version $VERSION" >&2
            exit 1
          fi
        shell: bash

      - name: Download all release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: List downloaded files (for debugging)
        run: |
          echo "Listing downloaded artifacts:"
          ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: artifacts/*/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_crate:
    name: Publish to crates.io
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Check if datadog-api version exists on crates.io
        id: check_version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match workspace version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Check if this version already exists on crates.io
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/datadog-api/$VERSION")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Version $VERSION already exists on crates.io"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION not found on crates.io, will publish"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish datadog-api to crates.io
        if: steps.check_version.outputs.should_publish == 'true'
        run: cargo publish --locked -p datadog-api --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
