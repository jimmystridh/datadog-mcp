[package]
name = "datadog-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MCP server that connects AI assistants to Datadog monitoring and observability platform"
keywords = ["datadog", "mcp", "model-context-protocol", "ai", "monitoring"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "datadog-mcp"
path = "src/main.rs"

[features]
default = ["toon", "keyring"]
# TOON format for token-efficient LLM output
toon = ["dep:toon"]
# Secure credential storage in system keyring
keyring = ["datadog-api/keyring"]
# All features enabled
full = ["toon", "keyring"]

[dependencies]
datadog-api = { version = "0.2.0", path = "../datadog-api", default-features = false }

# MCP Server SDK
rmcp = { version = "3.1.4", default-features = false, features = ["macros", "server", "transport-io"] }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dotenvy = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# CLI argument parsing
clap = { version = "4.6.6", features = ["derive"] }

# JSON Schema generation for tool input schemas
schemars = { version = "1.2.2", features = ["derive"] }

# TOON format for token-efficient LLM output (optional)
toon = { version = "0.1.2", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
